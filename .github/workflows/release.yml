name: Release (DMG · Developer ID)

# Direct/DMG channel: build → Developer ID sign → notarize → staple → DMG →
# GitHub Release → commit the Sparkle appcast to main → bump the Homebrew cask.
# Triggered by a version tag. The Mac App Store channel is separate
# (release-appstore.sh).
#
# Tag must match the app's MARKETING_VERSION (e.g. tag v1.2.3 ↔ version 1.2.3).
# Secrets live in the repo's GitHub Secrets (loaded from Infisical /mousugu).

on:
  push:
    tags:
      - 'v*.*.*'
  # Exercise the whole pipeline — build, sign, notarize, staple, package — without
  # publishing anything. Dispatch from a branch to smoke-test a pipeline change, or
  # from a tag with dry_run off to re-run a release that failed after packaging.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and notarize only; do not create the GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write        # create the Release, upload the DMG, push the appcast to main

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      version: ${{ steps.dmg.outputs.version }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
      DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
      SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the appcast commit below is pushed to main, and pushing
          # from a shallow clone is refused by the server.
          fetch-depth: 0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build · sign · notarize · package
        run: ./scripts/release-ci.sh

      - name: Locate the DMG
        id: dmg
        run: |
          set -euo pipefail
          DMG=$(ls build/MouSugu-*.dmg | head -1)
          [ -n "$DMG" ] || { echo "::error::No DMG produced"; exit 1; }
          VER=$(basename "$DMG" .dmg | sed 's/^MouSugu-//')
          # release-ci.sh writes this byte-identical copy; both are attached to
          # the release so releases/latest/download/MouSugu.dmg keeps resolving.
          [ -f build/MouSugu.dmg ] || { echo "::error::No stable-name copy produced"; exit 1; }
          cmp -s "$DMG" build/MouSugu.dmg || { echo "::error::MouSugu.dmg differs from $DMG"; exit 1; }
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify version matches tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VER="${{ steps.dmg.outputs.version }}"
          if [ "v$VER" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} != app MARKETING_VERSION ($VER). Bump MARKETING_VERSION to ${GITHUB_REF_NAME#v} or retag."
            exit 1
          fi

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ steps.dmg.outputs.version }}
          path: ${{ steps.dmg.outputs.dmg }}

      - name: Upload appcast as artifact
        uses: actions/upload-artifact@v4
        with:
          name: appcast
          path: website/public/appcast.xml

      - name: Publish GitHub Release
        # A dispatch defaults to dry-run; a tag push always publishes.
        if: github.ref_type == 'tag' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: update the assets if a release for this tag already exists
          # (e.g. a re-run), otherwise create the release.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "${{ steps.dmg.outputs.dmg }}" build/MouSugu.dmg --clobber
          else
            # The header goes above GitHub's generated notes; it carries the only
            # link in the body that reaches our own site, tagged so OpenPanel can
            # attribute it. The DMG assets stay bare — see the file's comment.
            gh release create "${GITHUB_REF_NAME}" \
              "${{ steps.dmg.outputs.dmg }}" build/MouSugu.dmg \
              --title "Mou Sugu ${{ steps.dmg.outputs.version }}" \
              --notes-file scripts/lib/release-notes-header.md \
              --generate-notes
          fi

      - name: Commit the appcast to main
        # release-ci.sh regenerated website/public/appcast.xml in the working tree.
        # mousugu.app deploys from main, so the feed only goes live once that file
        # lands there — Dokploy redeploys on the push. Runs on a dry run too (minus
        # the push) so a dispatch exercises this path.
        id: appcast
        env:
          VERSION: ${{ steps.dmg.outputs.version }}
          PUBLISH: ${{ github.ref_type == 'tag' && inputs.dry_run != true }}
        run: |
          set -euo pipefail
          APPCAST=website/public/appcast.xml

          # Move the regenerated feed onto the tip of main: the workflow runs on a
          # detached tag, and main may have advanced since it was cut.
          cp "$APPCAST" "$RUNNER_TEMP/appcast.xml"
          git checkout -- "$APPCAST"
          git fetch origin main
          git checkout -B appcast-publish origin/main
          cp "$RUNNER_TEMP/appcast.xml" "$APPCAST"

          if git diff --quiet -- "$APPCAST"; then
            echo "Appcast on main already matches this build — nothing to commit."
            exit 0
          fi

          git -c user.name='Agu Rodríguez' -c user.email='me@agu.uy' \
            commit -m "chore(release): publish v$VERSION in the Sparkle appcast" -- "$APPCAST"

          if [ "$PUBLISH" != "true" ]; then
            echo "Dry run — not pushing. The commit that would land on main:"
            git show --stat --oneline HEAD
            exit 0
          fi

          # main can move between the fetch above and the push; rebase and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (main moved?) — rebasing and retrying ($attempt/3)"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not push the appcast commit to main after 3 attempts"
          exit 1

      - name: Summary
        run: |
          {
            if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
              echo "### Released ${GITHUB_REF_NAME}"
              echo "- Notarized, stapled DMG attached to the GitHub Release as \`MouSugu-${{ steps.dmg.outputs.version }}.dmg\` and \`MouSugu.dmg\` (same bytes)."
              if [ "${{ steps.appcast.outputs.committed }}" = "true" ]; then
                echo "- Sparkle appcast committed to \`main\`; mousugu.app redeploys it on its own."
              else
                echo "- Sparkle appcast on \`main\` already matched this build — nothing committed."
              fi
            else
              echo "### Dry run — nothing published"
              echo "- Built, signed, notarized and stapled \`MouSugu-${{ steps.dmg.outputs.version }}.dmg\` (see the *dmg* artifact)."
            fi
            echo "- \`sha256\`: \`${{ steps.dmg.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  bump-cask:
    # Point 1930-dev/homebrew-tap at the release we just published, so
    # `brew install --cask 1930-dev/tap/mou-sugu` serves this version.
    #
    # A separate job on purpose: the write-scoped deploy key never shares a
    # runner with the build, and a failure here re-runs in a couple of minutes
    # instead of rebuilding and re-notarizing the app.
    name: Bump the Homebrew cask
    needs: release
    if: github.ref_type == 'tag' && inputs.dry_run != true
    runs-on: macos-15
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Hash the published DMG
        # The DMG is not byte-reproducible — the RFC-3161 timestamp Apple's TSA
        # embeds in the signature differs on every build — so the cask must pin
        # the asset users download, never a rebuild of it.
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG="$RUNNER_TEMP/MouSugu-$VERSION.dmg"
          gh release download "${GITHUB_REF_NAME}" -R "$GITHUB_REPOSITORY" \
            --pattern "MouSugu-$VERSION.dmg" --output "$DMG"
          echo "sha256=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Load the tap deploy key
        # ed25519 key with write access to homebrew-tap and nothing else, so a
        # compromised workflow cannot reach the rest of the org.
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Rewrite the cask
        id: cask
        env:
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          set -euo pipefail
          brew tap 1930-dev/tap
          TAP=$(brew --repository 1930-dev/tap)
          # brew taps over HTTPS, which the deploy key cannot push to.
          git -C "$TAP" remote set-url origin git@github.com:1930-dev/homebrew-tap.git
          # Current Homebrew clones taps in full, but it used to clone them
          # shallow and the server refuses a push from a shallow clone.
          if [ "$(git -C "$TAP" rev-parse --is-shallow-repository)" = "true" ]; then
            git -C "$TAP" fetch --unshallow origin
          fi
          echo "tap=$TAP" >> "$GITHUB_OUTPUT"

          CASK="$TAP/Casks/mou-sugu.rb"
          sed -i '' \
            -e "s|^  version \".*\"$|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$SHA256\"|" \
            "$CASK"

          # A sed that matched nothing exits 0 and would look like "already up to
          # date" further down, leaving the cask pinned to the previous release.
          grep -qx "  version \"$VERSION\"" "$CASK" || {
            echo "::error::version line in mou-sugu.rb did not take the rewrite"; exit 1; }
          grep -qx "  sha256 \"$SHA256\"" "$CASK" || {
            echo "::error::sha256 line in mou-sugu.rb did not take the rewrite"; exit 1; }

      - name: Verify the cask before pushing it
        # Ordered before the push so a bad cask never reaches the tap. `brew
        # install` is the end-to-end check that the pinned sha256 matches what
        # the release actually serves.
        run: |
          set -euo pipefail
          brew audit --cask --online --strict 1930-dev/tap/mou-sugu
          brew install --cask 1930-dev/tap/mou-sugu
          brew uninstall --cask 1930-dev/tap/mou-sugu

      - name: Commit and push the bump
        id: push
        env:
          TAP: ${{ steps.cask.outputs.tap }}
        run: |
          set -euo pipefail
          cd "$TAP"

          # Idempotent: a re-run of an already-bumped release leaves no commit.
          if git diff --quiet -- Casks/mou-sugu.rb; then
            echo "Cask already at $VERSION — nothing to commit."
            exit 0
          fi

          git -c user.name='Agu Rodríguez' -c user.email='me@agu.uy' \
            commit -m "chore(mou-sugu): bump to $VERSION" -- Casks/mou-sugu.rb

          # The tap is low-traffic, but another bump could land between the tap
          # and the push; rebase and retry rather than fail the release.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (tap moved?) — rebasing and retrying ($attempt/3)"
            git pull --rebase origin main
          done
          echo "::error::Could not push the cask bump after 3 attempts"
          exit 1

      - name: Summary
        env:
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          {
            echo "### Homebrew cask"
            if [ "${{ steps.push.outputs.committed }}" = "true" ]; then
              echo "- \`1930-dev/homebrew-tap\` bumped to \`$VERSION\`."
            else
              echo "- \`1930-dev/homebrew-tap\` already at \`$VERSION\` — nothing committed."
            fi
            echo "- Pinned \`sha256\`: \`$SHA256\` (hashed from the published asset)."
            echo "- \`brew audit --online --strict\`, \`brew install\` and \`brew uninstall\` passed on macos-15."
          } >> "$GITHUB_STEP_SUMMARY"
