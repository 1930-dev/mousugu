name: Release (DMG · Developer ID)

# Direct/DMG channel: build → Developer ID sign → notarize → staple → DMG →
# GitHub Release → commit the Sparkle appcast to main. Triggered by a version
# tag. The Mac App Store channel is separate (release-appstore.sh).
#
# Tag must match the app's MARKETING_VERSION (e.g. tag v1.2.3 ↔ version 1.2.3).
# Secrets live in the repo's GitHub Secrets (loaded from Infisical /mousugu).

on:
  push:
    tags:
      - 'v*.*.*'
  # Exercise the whole pipeline — build, sign, notarize, staple, package — without
  # publishing anything. Dispatch from a branch to smoke-test a pipeline change, or
  # from a tag with dry_run off to re-run a release that failed after packaging.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and notarize only; do not create the GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write        # create the Release, upload the DMG, push the appcast to main

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
      DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
      SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the appcast commit below is pushed to main, and pushing
          # from a shallow clone is refused by the server.
          fetch-depth: 0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build · sign · notarize · package
        run: ./scripts/release-ci.sh

      - name: Locate the DMG
        id: dmg
        run: |
          set -euo pipefail
          DMG=$(ls build/MouSugu-*.dmg | head -1)
          [ -n "$DMG" ] || { echo "::error::No DMG produced"; exit 1; }
          VER=$(basename "$DMG" .dmg | sed 's/^MouSugu-//')
          # release-ci.sh writes this byte-identical copy; both are attached to
          # the release so releases/latest/download/MouSugu.dmg keeps resolving.
          [ -f build/MouSugu.dmg ] || { echo "::error::No stable-name copy produced"; exit 1; }
          cmp -s "$DMG" build/MouSugu.dmg || { echo "::error::MouSugu.dmg differs from $DMG"; exit 1; }
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify version matches tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VER="${{ steps.dmg.outputs.version }}"
          if [ "v$VER" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} != app MARKETING_VERSION ($VER). Bump MARKETING_VERSION to ${GITHUB_REF_NAME#v} or retag."
            exit 1
          fi

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ steps.dmg.outputs.version }}
          path: ${{ steps.dmg.outputs.dmg }}

      - name: Upload appcast as artifact
        uses: actions/upload-artifact@v4
        with:
          name: appcast
          path: website/public/appcast.xml

      - name: Publish GitHub Release
        # A dispatch defaults to dry-run; a tag push always publishes.
        if: github.ref_type == 'tag' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: update the assets if a release for this tag already exists
          # (e.g. a re-run), otherwise create the release.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "${{ steps.dmg.outputs.dmg }}" build/MouSugu.dmg --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${{ steps.dmg.outputs.dmg }}" build/MouSugu.dmg \
              --title "Mou Sugu ${{ steps.dmg.outputs.version }}" \
              --generate-notes
          fi

      - name: Commit the appcast to main
        # release-ci.sh regenerated website/public/appcast.xml in the working tree.
        # mousugu.app deploys from main, so the feed only goes live once that file
        # lands there — Dokploy redeploys on the push. Runs on a dry run too (minus
        # the push) so a dispatch exercises this path.
        id: appcast
        env:
          VERSION: ${{ steps.dmg.outputs.version }}
          PUBLISH: ${{ github.ref_type == 'tag' && inputs.dry_run != true }}
        run: |
          set -euo pipefail
          APPCAST=website/public/appcast.xml

          # Move the regenerated feed onto the tip of main: the workflow runs on a
          # detached tag, and main may have advanced since it was cut.
          cp "$APPCAST" "$RUNNER_TEMP/appcast.xml"
          git checkout -- "$APPCAST"
          git fetch origin main
          git checkout -B appcast-publish origin/main
          cp "$RUNNER_TEMP/appcast.xml" "$APPCAST"

          if git diff --quiet -- "$APPCAST"; then
            echo "Appcast on main already matches this build — nothing to commit."
            exit 0
          fi

          git -c user.name='Agu Rodríguez' -c user.email='me@agu.uy' \
            commit -m "chore(release): publish v$VERSION in the Sparkle appcast" -- "$APPCAST"

          if [ "$PUBLISH" != "true" ]; then
            echo "Dry run — not pushing. The commit that would land on main:"
            git show --stat --oneline HEAD
            exit 0
          fi

          # main can move between the fetch above and the push; rebase and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (main moved?) — rebasing and retrying ($attempt/3)"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not push the appcast commit to main after 3 attempts"
          exit 1

      - name: Summary
        run: |
          {
            if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
              echo "### Released ${GITHUB_REF_NAME}"
              echo "- Notarized, stapled DMG attached to the GitHub Release as \`MouSugu-${{ steps.dmg.outputs.version }}.dmg\` and \`MouSugu.dmg\` (same bytes)."
              if [ "${{ steps.appcast.outputs.committed }}" = "true" ]; then
                echo "- Sparkle appcast committed to \`main\`; mousugu.app redeploys it on its own."
              else
                echo "- Sparkle appcast on \`main\` already matched this build — nothing committed."
              fi
            else
              echo "### Dry run — nothing published"
              echo "- Built, signed, notarized and stapled \`MouSugu-${{ steps.dmg.outputs.version }}.dmg\` (see the *dmg* artifact)."
            fi
            echo "- \`sha256\`: \`${{ steps.dmg.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
